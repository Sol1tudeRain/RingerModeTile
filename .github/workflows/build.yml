name: Build RingerModeTile APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test ringer cycle
        run: bash tests/run.sh
      - name: Load optional private signing key
        env:
          KEYSTORE_B64: ${{ secrets.RINGER_SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RINGER_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASSWORD" ]]; then
            umask 077
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ringer.p12"
            echo "RINGER_SIGNING_KEYSTORE=$RUNNER_TEMP/ringer.p12" >> "$GITHUB_ENV"
            echo "RINGER_SIGNING_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "STABLE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "STABLE_SIGNING=false" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signed APK
        if: env.STABLE_SIGNING == 'true'
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          EXPECTED=449290a73a023d98cbd3f034339a144a18e0c735841e9fe4b584ac244d3cfc43
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Signing certificate does not match the fixed RingerModeTile key"
            exit 1
          fi
      - name: Upload signed APK
        if: env.STABLE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RingerModeTile-signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Collect unsigned APK and signing tool
        if: env.STABLE_SIGNING != 'true'
        run: |
          mkdir -p build-transfer
          cp app/build/outputs/apk/release/app-release-unsigned.apk build-transfer/unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build-transfer/apksigner.jar
      - name: Upload unsigned build
        if: env.STABLE_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RingerModeTile-unsigned-build
          path: build-transfer/
          if-no-files-found: error
      - name: Clear key
        if: always()
        run: rm -f "$RUNNER_TEMP/ringer.p12"
